name: weekly

# Thursday afternoon: weather and train connections for the coming weekend.
# The Thursday evening Claude run picks from what this writes.
on:
  workflow_dispatch:
    inputs:
      today:
        description: "Pretend today is YYYY-MM-DD (optional)"
        required: false
  schedule:
    - cron: "41 13 * * 4"   # Thursdays 13:41 UTC, a few hours before the Claude run

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-light.txt

      - run: pip install -q -r requirements-light.txt

      - name: Fetch weather and connections
        env:
          TODAY: ${{ github.event.inputs.today }}
        run: |
          set -o pipefail
          mkdir -p out/logs
          ARGS=()
          if [[ "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then ARGS=(--today "$TODAY"); fi
          python -m trainhead.cli weekly --catalog data-branch/catalog --history state/history.json --out out/weekly "${ARGS[@]}" 2>&1 | tee out/logs/weekly.log

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          res = json.load(open("out/weekly/latest.json"))
          for day, d in res["days"].items():
              print(f"### {d['weekday'].title()} {day}\n")
              for kind in ("hikes", "runs", "fallbacks"):
                  for c in d.get(kind, [])[:5]:
                      w = c["weather"]
                      dep = ((c.get("outbound") or {}).get("dep") or "")[11:16] or "unchecked"
                      print(f"- {kind[:-1]}: {c['route']['name']}, weather {w['score']}, "
                            f"{', '.join(w['flags']) or 'no flags'}, out {dep}, "
                            f"buffer {c.get('buffer_min', '?')} min")
              print()
          PY

      - name: Report a failure
        if: failure()
        run: python scripts/annotate_failure.py out/logs/weekly.log "weekly failed"

      - name: Publish to the data branch
        if: always()
        run: |
          if [ -d out ]; then scripts/publish_data.sh out "weekly $(date -u +%Y-%m-%d) (${{ job.status }})"; fi
